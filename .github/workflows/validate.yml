name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install schema compiler
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --input-type=module --check < "$file" || exit 1
          done
      - name: Build extension
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: fast-translate-extension
          path: dist/*.shell-extension.zip
